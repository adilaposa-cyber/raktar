{% extends "base.html" %}
{% block title %}Bevételezés{% endblock %}
{% block page_title %}Bevételezés{% endblock %}

{% block topbar_actions %}
<button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">
  <i class="bi bi-plus-lg me-1"></i>Új rendelés
</button>
{% endblock %}

{% block content %}
<!-- Filter -->
<div class="card border-0 shadow-sm mb-3">
  <div class="card-body py-2">
    <div class="d-flex gap-2">
      <select class="form-select form-select-sm w-auto" id="filter-status" onchange="loadOrders()">
        <option value="">Összes</option>
        <option value="pending" selected>Várakozó</option>
        <option value="partial">Részleges</option>
        <option value="complete">Kész</option>
        <option value="cancelled">Törölve</option>
      </select>
      <button class="btn btn-sm btn-outline-secondary" onclick="loadOrders()"><i class="bi bi-arrow-clockwise"></i></button>
    </div>
  </div>
</div>

<div class="row g-3" id="orders-container"></div>

<!-- Receive goods modal -->
<div class="modal fade" id="receiveModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Bevételezés rögzítése</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-info small" id="receive-info"></div>
        <div class="mb-3">
          <label class="form-label">Bevételezett mennyiség *</label>
          <input class="form-control" type="number" id="r-qty" min="0">
        </div>
        <div class="mb-3">
          <label class="form-label">Raklap szám (opcionális)</label>
          <input class="form-control" id="r-pallet" placeholder="Automatikus ha üres">
        </div>
        <div class="mb-3">
          <label class="form-label">RFID EPC (opcionális)</label>
          <input class="form-control" id="r-rfid" placeholder="pl. E200...">
        </div>
        <div class="mb-3">
          <label class="form-label">Kezelő</label>
          <input class="form-control" id="r-operator" value="raktáros">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Mégsem</button>
        <button class="btn btn-success" onclick="doReceive()">Bevételezés</button>
      </div>
    </div>
  </div>
</div>

<!-- Create order modal -->
<div class="modal fade" id="createModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Új bevételezési rendelés</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">Rendelésszám *</label>
          <input class="form-control" id="f-order" placeholder="pl. PO-2024-001"></div>
        <div class="mb-3"><label class="form-label">Infor LN referencia</label>
          <input class="form-control" id="f-infor" placeholder="LN megrendelésszám"></div>
        <div class="mb-3"><label class="form-label">Szállító</label>
          <input class="form-control" id="f-supplier"></div>
        <div class="mb-3"><label class="form-label">Cikk</label>
          <select class="form-select" id="f-article"><option value="">– Válasszon –</option></select></div>
        <div class="row g-2 mb-3">
          <div class="col-8"><label class="form-label">Várható mennyiség</label>
            <input class="form-control" type="number" id="f-qty" value="0"></div>
          <div class="col-4"><label class="form-label">Egység</label>
            <input class="form-control" id="f-unit" value="db"></div>
        </div>
        <div class="mb-3"><label class="form-label">Célzóna</label>
          <input class="form-control" id="f-zone" placeholder="pl. A"></div>
        <div class="mb-3"><label class="form-label">Megjegyzés</label>
          <textarea class="form-control" id="f-notes" rows="2"></textarea></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Mégsem</button>
        <button class="btn btn-primary" onclick="createOrder()">Létrehozás</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentOrderId = null;

async function loadOrders() {
  const status = document.getElementById('filter-status').value;
  const r = await fetch(`/api/receiving/${status ? '?status='+status : ''}`);
  const data = await r.json();
  const container = document.getElementById('orders-container');
  if(!data.length) {
    container.innerHTML = '<div class="col-12 text-center text-muted py-4">Nincs rendelés</div>';
    return;
  }
  container.innerHTML = data.map(o => {
    const pct = o.expected_quantity > 0 ? Math.round(o.received_quantity/o.expected_quantity*100) : 0;
    const statusMap = {pending:'secondary', partial:'warning', complete:'success', cancelled:'danger'};
    return `
    <div class="col-md-6 col-xl-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center">
          <div>
            <code class="small">${o.order_number}</code>
            ${o.infor_ln_ref ? `<span class="badge bg-secondary-subtle text-secondary ms-1">${o.infor_ln_ref}</span>` : ''}
          </div>
          <span class="badge bg-${statusMap[o.status]||'secondary'}">${statusLbl(o.status)}</span>
        </div>
        <div class="card-body">
          <p class="mb-1"><strong>${o.article ? o.article.article_number+' – '+o.article.name : 'Cikk nélkül'}</strong></p>
          ${o.supplier ? `<p class="text-muted small mb-1"><i class="bi bi-building me-1"></i>${o.supplier}</p>` : ''}
          <p class="mb-2 small">Várható: <strong>${o.expected_quantity} ${o.unit}</strong> / Bevételezve: <strong>${o.received_quantity} ${o.unit}</strong></p>
          <div class="progress" style="height:8px">
            <div class="progress-bar bg-${pct>=100?'success':'warning'}" style="width:${Math.min(pct,100)}%"></div>
          </div>
          <p class="text-muted small mt-1">${pct}%</p>
        </div>
        <div class="card-footer bg-transparent border-0 d-flex gap-2">
          ${o.status !== 'complete' && o.status !== 'cancelled' ? `
          <button class="btn btn-sm btn-success" onclick="openReceive(${o.id}, '${o.order_number}', ${o.expected_quantity}, ${o.received_quantity}, '${o.unit}')">
            <i class="bi bi-truck me-1"></i>Bevételezés
          </button>` : ''}
          ${o.status === 'pending' ? `
          <button class="btn btn-sm btn-outline-danger ms-auto" onclick="cancelOrder(${o.id})">
            <i class="bi bi-x"></i>Törlés
          </button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function openReceive(id, num, exp, recv, unit) {
  currentOrderId = id;
  document.getElementById('receive-info').textContent =
    `${num} – Várt: ${exp} ${unit}, eddig bevételezve: ${recv} ${unit}`;
  document.getElementById('r-qty').value = exp - recv;
  new bootstrap.Modal(document.getElementById('receiveModal')).show();
}

async function doReceive() {
  if(!currentOrderId) return;
  const payload = {
    quantity: parseFloat(document.getElementById('r-qty').value)||0,
    pallet_number: document.getElementById('r-pallet').value||null,
    rfid_epc: document.getElementById('r-rfid').value||null,
    operator: document.getElementById('r-operator').value||'raktáros',
  };
  const r = await fetch(`/api/receiving/${currentOrderId}/receive`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const d = await r.json();
  if(r.ok) {
    bootstrap.Modal.getInstance(document.getElementById('receiveModal')).hide();
    showToast(`Bevételezve! Raklap: ${d.pallet_number} | Feladat: ${d.task_number} | Hely: ${d.suggested_location||'–'}`, 'success');
    loadOrders();
  } else { showToast(d.detail||'Hiba!','danger'); }
}

async function cancelOrder(id) {
  if(!confirm('Biztosan törli?')) return;
  await fetch(`/api/receiving/${id}/cancel`, {method:'PATCH'});
  showToast('Rendelés törölve','warning');
  loadOrders();
}

async function createOrder() {
  const payload = {
    order_number: document.getElementById('f-order').value.trim(),
    infor_ln_ref: document.getElementById('f-infor').value||null,
    supplier: document.getElementById('f-supplier').value||null,
    article_id: document.getElementById('f-article').value||null,
    expected_quantity: parseFloat(document.getElementById('f-qty').value)||0,
    unit: document.getElementById('f-unit').value||'db',
    target_zone: document.getElementById('f-zone').value||null,
    notes: document.getElementById('f-notes').value||null,
  };
  if(!payload.order_number) { showToast('Rendelésszám kötelező!','danger'); return; }
  const r = await fetch('/api/receiving/', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(r.ok) {
    bootstrap.Modal.getInstance(document.getElementById('createModal')).hide();
    showToast('Rendelés létrehozva','success');
    loadOrders();
  } else { const e=await r.json(); showToast(e.detail||'Hiba!','danger'); }
}

async function loadArticles() {
  const r = await fetch('/api/articles/');
  const data = await r.json();
  const sel = document.getElementById('f-article');
  data.forEach(a => sel.appendChild(new Option(`${a.article_number} – ${a.name}`, a.id)));
}

function statusLbl(s) {
  return {pending:'Várakozó', partial:'Részleges', complete:'Kész', cancelled:'Törölve'}[s]||s;
}

loadOrders();
loadArticles();
</script>
{% endblock %}
